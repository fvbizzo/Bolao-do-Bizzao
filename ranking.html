<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking - Bolão do Bizzão</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Classificação Geral 🏆</h1>
            <nav>
                <a href="palpites.html">Meus Palpites</a>
                <button id="btn-sair">Sair</button>
            </nav>
        </header>

        <main>
            <div class="ranking-caixa">
                <table id="tabela-ranking">
                    <thead>
                        <tr>
                            <th>Pos</th>
                            <th>Jogador</th>
                            <th>Pontos</th>
                        </tr>
                    </thead>
                    <tbody id="corpo-ranking">
                        </tbody>
                </table>
            </div>

            <div style="text-align:center; margin-top: 16px;">
                <button id="btn-ver-grafico" class="btn-secundario" style="display:none;">Ver Evolução 📈</button>
            </div>

            <div id="secao-historico" class="ranking-caixa" style="display:none; margin-top:16px;">
                <h3 style="color:#008000; font-size:1.1em; margin:0 0 12px 0;">Evolução de Pontos por Jogo</h3>
                <canvas id="grafico-historico"></canvas>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script type="module" src="js/ranking.js"></script>
</body>
</html>
